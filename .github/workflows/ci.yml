name: CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Weekly run so new advisories (govulncheck, npm audit) surface without code changes.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"

defaults:
  run:
    shell: bash

jobs:
  # Decides which jobs a pull request needs (git diff against the merge base, no third-party
  # action). The weekly run, manual runs and any change to this workflow run everything. Pushes
  # to main run every job except the root jobs (instances, nftables, installer): the pull request
  # already ran them on the same tree, and they take the longest.
  #
  # Runner placement: every job runs on a fresh GitHub-hosted runner (ubuntu-24.04). Never use
  # self-hosted runners here: the repository is public, and a pull request from a fork would run
  # its code on them (SEC-08, docs/dev/README.md "CI").
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      go: ${{ steps.diff.outputs.go }}
      web: ${{ steps.diff.outputs.web }}
      preview: ${{ steps.diff.outputs.preview }}
      openapi: ${{ steps.diff.outputs.openapi }}
      e2e: ${{ steps.diff.outputs.e2e }}
      nftables: ${{ steps.diff.outputs.nftables }}
      instances: ${{ steps.diff.outputs.instances }}
      instances_shards: ${{ steps.diff.outputs.instances_shards }}
      release: ${{ steps.diff.outputs.release }}
      installer: ${{ steps.diff.outputs.installer }}
      installer_root: ${{ steps.diff.outputs.installer_root }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed files
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          all=false
          files=""
          main_push=false
          if [ "${EVENT}" = push ]; then
            all=true
            main_push=true
          elif [ "${EVENT}" != pull_request ]; then
            all=true
          else
            files="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")"
            printf '%s\n' "${files}"
            if grep -qE '^\.github/workflows/ci\.yml$' <<<"${files}"; then
              all=true
            fi
          fi
          out() { # out <name> <regex> [root]
            local v=false
            if [ "${all}" = true ] || grep -qE "$2" <<<"${files}"; then v=true; fi
            if [ "${3:-}" = root ] && [ "${main_push}" = true ]; then v=false; fi
            echo "$1=${v}" >> "${GITHUB_OUTPUT}"
            echo "$1=${v}"
          }
          gomod='^go\.(mod|sum)$'
          out go "^(cmd|internal|api|deploy)/|${gomod}|^sqlc\.yaml$|^\.golangci\.yml$|^Makefile$|^scripts/install-(restic|golangci-lint)\.sh$"
          out web '^web/|^api/|^\.node-version$'
          out preview '^web/Dockerfile\.preview$|^compose\.preview\.yaml$|^web/package(-lock)?\.json$|^web/vite\.config\.ts$'
          out openapi '^api/|^tools/redocly/|^\.node-version$'
          out e2e "^(cmd|internal|api|web)/|^scripts/vm-test\.sh$|^\.node-version$|${gomod}"
          out nftables "^internal/(agent|defense|auth)/|^cmd/(agent|panel)/|^scripts/ci-acceptance\.sh$|${gomod}" root
          # Instance acceptance shards (scripts/ci-instances/<shard>.sh), each a matrix entry of
          # the job instances. Shared code runs every shard: cmd/, go.mod/sum, the dispatcher and
          # lib.sh, restic and any internal/ package that is not one shard's own (agent, config,
          # servers, store, auth, ...). The own packages pick their shards below.
          own='^internal/(files|plugins|monitoring|notify|backups|timescale)/'
          shared="$(grep -E "^(cmd|internal)/|^scripts/(ci-instances\.sh|ci-instances/lib\.sh|install-restic\.sh)$|${gomod}" <<<"${files}" |
            grep -vE "${own}" || true)"
          shards=()
          shard() { # shard <name> <regex of its own files>
            if [ "${all}" = true ] || [ -n "${shared}" ] || grep -qE "$2|^scripts/ci-instances/$1\.sh$" <<<"${files}"; then
              shards+=("$1")
            fi
          }
          shard core '^internal/files/|^scripts/mc-status\.py$'
          shard plugins '^internal/(files|plugins)/'
          shard monitoring-metrics '^internal/(monitoring|notify|timescale)/'
          shard monitoring-alerts '^internal/(monitoring|notify|timescale)/'
          shard backups '^internal/(files|backups|timescale)/'
          shard web '^internal/agent/(instances|firewall)/|^internal/servers/|^deploy/caddy/|^scripts/install/'
          if [ "${main_push}" = true ]; then shards=(); fi # root job, see above
          json="$(printf '%s\n' "${shards[@]}" | jq -Rnc '[inputs | select(. != "")]')"
          echo "instances_shards=${json}" >> "${GITHUB_OUTPUT}"
          echo "instances_shards=${json}"
          instances=true
          if [ "${json}" = '[]' ]; then instances=false; fi
          echo "instances=${instances}" >> "${GITHUB_OUTPUT}"
          echo "instances=${instances}"
          out release "^cmd/|^internal/(webui|timescale)/|^deploy/|^scripts/install/|^\.goreleaser\.yaml$|^Makefile$|^web/package(-lock)?\.json$|^web/vite\.config\.ts$|^\.node-version$|${gomod}"
          # The installer jobs share one filter: the lint on every run; the lifecycle (root, not on
          # pushes to main) also on any internal/ change, since it runs the real panel, agent and
          # files service (like instances).
          installer="^scripts/install/|^deploy/|^scripts/(ci-installer|install-restic|install-golangci-lint|testvm-deploy|sign-release|verify-release-build|release-lib)\.sh$|^\.node-version$|^cmd/|^internal/(config|unixsock)/|^\.goreleaser\.yaml$|^Makefile$|${gomod}"
          out installer "${installer}"
          out installer_root "${installer}|^internal/" root

  go:
    name: Go (race tests, lint, vulns)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify modules
        run: |
          go mod verify
          go mod tidy -diff

      # The release binary instead of "go install" (which compiles sqlc with cgo, ~100 s); its
      # SHA-256 comes from the GitHub release API (asset digest).
      - name: Check sqlc output is up to date
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(grep -m1 -oE 'sqlc v[0-9]+\.[0-9]+\.[0-9]+' internal/store/db.go | cut -d' ' -f2 || true)"
          if [ -z "${version}" ]; then
            echo "::error file=internal/store/db.go::no 'sqlc vX.Y.Z' header found"
            exit 1
          fi
          echo "Using sqlc ${version} (taken from the generated header)"
          asset="sqlc_${version#v}_linux_amd64.tar.gz"
          digest="$(gh api "repos/sqlc-dev/sqlc/releases/tags/${version}" --jq ".assets[] | select(.name == \"${asset}\") | .digest")"
          case "${digest}" in
            sha256:*) ;;
            *) echo "::error::no sha256 digest for ${asset}"; exit 1 ;;
          esac
          tmp="$(mktemp -d)"
          curl -fsSL -o "${tmp}/${asset}" "https://github.com/sqlc-dev/sqlc/releases/download/${version}/${asset}"
          echo "${digest#sha256:}  ${tmp}/${asset}" | sha256sum -c -
          tar -xzf "${tmp}/${asset}" -C "${tmp}" sqlc
          "${tmp}/sqlc" generate
          if [ -n "$(git status --porcelain -- internal/store)" ]; then
            git status --porcelain -- internal/store
            git --no-pager diff -- internal/store
            echo "::error::generated sqlc code is stale - run 'sqlc generate' and commit the result"
            exit 1
          fi

      # restic for the backup integration tests of the files service (sub-project 4); without
      # MCPANEL_TEST_RESTIC they skip. Pinned release binary with SHA-256 check.
      - name: Install restic
        run: sudo bash scripts/install-restic.sh

      # The race run executes every test, so a separate run without -race would only repeat it
      # (the release workflow still runs both).
      - name: Tests (race detector)
        env:
          MCPANEL_TEST_RESTIC: /usr/local/bin/restic
        run: |
          umask 022
          make test-race

      # golangci-lint's analysis cache, like the Go caches of setup-go. A pull request's cache is
      # scoped to its own ref and never read by main.
      - name: Cache golangci-lint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ hashFiles('go.sum', '.golangci.yml', 'scripts/install-golangci-lint.sh') }}-${{ github.sha }}
          restore-keys: |
            golangci-lint-${{ runner.os }}-${{ hashFiles('go.sum', '.golangci.yml', 'scripts/install-golangci-lint.sh') }}-
            golangci-lint-${{ runner.os }}-

      # The pinned release binary with its SHA-256 (the same script as on the test VM).
      - name: golangci-lint (incl. gosec, gofmt, goimports)
        run: |
          bash scripts/install-golangci-lint.sh "${RUNNER_TEMP}/bin"
          "${RUNNER_TEMP}/bin/golangci-lint" run ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  web:
    name: Web (lint, typecheck, test, build, audit)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      # No lifecycle scripts (SEC-08): only fsevents (macOS) and msw (copies the committed
      # public/mockServiceWorker.js) have any.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Generated files are committed
        run: |
          set -euo pipefail
          npm run gen:api
          if [ -n "$(git status --porcelain -- .)" ]; then
            git status --porcelain -- .
            git --no-pager diff -- .
            echo "::error::web/ has uncommitted generated changes - run 'npm run gen:api' and 'npm run build', then commit"
            exit 1
          fi

      - name: npm audit
        run: npm audit --audit-level=high

      # The UI preview image (make preview) must keep building; it is never started in CI.
      - name: Build UI preview image
        if: needs.changes.outputs.preview == 'true'
        run: sudo docker build --file Dockerfile.preview --tag mcpanel-preview:ci .

  openapi:
    name: OpenAPI lint
    needs: changes
    if: needs.changes.outputs.openapi == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: tools/redocly/package-lock.json

      # Pinned by tools/redocly/package-lock.json, without install scripts (SEC-08).
      - name: Install Redocly
        working-directory: tools/redocly
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Redocly lint
        run: tools/redocly/node_modules/.bin/redocly lint api/openapi.yaml --extends=minimal

  e2e:
    name: E2E (Playwright, real backend)
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The same suite as `make test-vm SUITE=e2e`: real backend in dev mode (panel 18080,
      # Playwright mock 5174). The script installs the Playwright Chromium of the lockfile's
      # version and its system packages; Go and Node come from the setup steps above.
      - name: Playwright (real and mock backend)
        run: bash scripts/vm-test.sh e2e

      - name: Logs on failure
        if: failure()
        run: tail -n 200 .dev/agent.log .dev/files.log .dev/panel.log || true

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: |
            web/test-results
            web/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  nftables:
    name: nftables integration (root)
    needs: changes
    if: needs.changes.outputs.nftables == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install nftables
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends nftables
          sudo nft --version

      # Test binaries are compiled as the runner user and only executed as root,
      # so no root-owned files end up in the Go caches.
      - name: Integration tests as root
        run: go test -tags nftintegration -exec sudo -count=1 -v ./internal/agent/...

      # GitHub's Ubuntu runners ship a running Docker daemon. The tests pull a small,
      # digest-pinned busybox image instead of the itzg images. MCPANEL_IT_STRICT=1 turns
      # the "host not clean" skip of the manager test into a failure.
      - name: Docker integration tests as root
        run: |
          sudo docker version
          go test -tags dockerintegration -exec "sudo env MCPANEL_IT_STRICT=1" -count=1 -v ./internal/agent/...

      # Acceptance check 5 end to end: agent (root, nftables) + panel (user mcpanel) in
      # production mode; five failed logins must jail the client IP in nftables.
      - name: Build panel and agent
        run: |
          go build -o bin/panel ./cmd/panel
          go build -o bin/agent ./cmd/agent

      - name: Acceptance check 5 (nftables)
        run: sudo scripts/ci-acceptance.sh bin/panel bin/agent

  # One matrix entry per shard of scripts/ci-instances.sh (changes.instances_shards); CI OK sees
  # the aggregated result of the matrix. The panel is built with -tags acceptance and runs with
  # time scale 10 (internal/timescale): monitoring passes, alert windows and the backup tick are
  # ten times faster. Release builds never carry the tag (.goreleaser.yaml checks the binary).
  instances:
    name: Instance acceptance (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.instances == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.instances_shards) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # The panel is built without the web build (internal/webui/dist only holds .gitkeep, as in
      # the nftables job): the acceptance uses /api only. The pinned server (java21), router and
      # web router (Caddy) images from internal/config are pulled meanwhile.
      - name: Build agent, files service and panel; pull images
        run: |
          set -euo pipefail
          images="$(grep -oE '"(itzg/(minecraft-server:[^"]*-java21|mc-router:[^"]*)|caddy:[^"]*)@sha256:[0-9a-f]{64}"' internal/config/config.go | tr -d '"')"
          [ "$(wc -l <<<"${images}")" = 3 ] || { echo "image refs not found: ${images}" >&2; exit 1; }
          (for i in ${images}; do docker pull -q "${i}"; done) >"${RUNNER_TEMP}/pull.log" 2>&1 &
          pull=$!
          go build -o bin/agent ./cmd/agent
          go build -o bin/files ./cmd/files
          go build -tags acceptance -o bin/panel ./cmd/panel
          wait "${pull}" || { cat "${RUNNER_TEMP}/pull.log" >&2; exit 1; }
          cat "${RUNNER_TEMP}/pull.log"

      # The files service runs restic for backups (sub-project 4): the pinned release.
      - name: Install restic
        run: sudo bash scripts/install-restic.sh

      # The agent's firewall and egress filter, and the monitoring shards' rule against the
      # panel's pings (server.down) use nftables.
      - name: Install nftables
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends nftables
          sudo nft --version

      # Shards (each file in scripts/ci-instances/ starts with what it checks): core (real agent +
      # Docker + itzg Paper server: routing by hostname, hardening, egress filter, console, crash
      # restart, removal; the files service as mcpanel-mc), plugins (Chunky from Modrinth,
      # ViaBackwards + ViaVersion from Hangar, mrpack import), monitoring-metrics (history, live
      # and host values, RCON noise, host.disk_low/ok), monitoring-alerts (server.down/recovered
      # via nftables, server.crash_loop, the down-alerts switch) and backups (real restic:
      # backup, restore, download, schedule, pin, delete, purge) and web (web ports: a host Caddy
      # with the installer's catch-all site in front of mcpanel-web, a responder in the server,
      # isolation, unpublish). The panel shards run the panel in production mode with TOTP
      # sign-in and sudo.
      - name: Instance acceptance (${{ matrix.shard }})
        env:
          SHARD: ${{ matrix.shard }}
        run: sudo env MCPANEL_ACCEPTANCE_TIMESCALE=10 scripts/ci-instances.sh "${SHARD}" bin/agent bin/files bin/panel

  build:
    name: Build & release snapshot
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci --ignore-scripts

      - name: make build
        run: make build

      - name: Check host binary (static, no cgo, embedded UI)
        run: |
          set -euo pipefail
          file bin/panel
          file bin/panel | grep -q 'ELF 64-bit LSB executable, x86-64'
          file bin/panel | grep -q 'statically linked'
          go version -m bin/panel | grep -q 'CGO_ENABLED=0'
          grep -aq '/assets/index-' bin/panel
          # The acceptance time scale (internal/timescale) only exists with -tags acceptance.
          if grep -aq 'MCPANEL_ACCEPTANCE' bin/panel; then echo "acceptance time scale in bin/panel" >&2; exit 1; fi

      - name: Cross-compile linux/arm64
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/linux-arm64"
          mkdir -p "${out}"
          GOOS=linux GOARCH=arm64 go build -trimpath -o "${out}/" ./cmd/...
          file "${out}/panel"
          file "${out}/panel" | grep -q 'ARM aarch64'

      - name: GoReleaser config check
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.2
          args: check

      - name: GoReleaser snapshot
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --snapshot --clean

      - name: Verify snapshot artifacts
        run: |
          set -euo pipefail
          ls -l dist
          version="$(jq -r '.version' dist/metadata.json)"
          echo "snapshot version: ${version}"
          count="$(jq '[.[] | select(.type == "Binary")] | length' dist/artifacts.json)"
          if [ "${count}" -ne 6 ]; then
            echo "::error::expected 6 binaries (panel+agent+files x amd64+arm64), got ${count}"
            exit 1
          fi
          jq -r '.[] | select(.type == "Binary") | "\(.goarch) \(.name) \(.path)"' dist/artifacts.json |
            while read -r arch name path; do
              case "${arch}" in
                amd64) want='x86-64' ;;
                arm64) want='ARM aarch64' ;;
                *) echo "::error::unexpected arch ${arch}"; exit 1 ;;
              esac
              info="$(file "${path}")"
              echo "${info}"
              grep -q "${want}" <<<"${info}"
              grep -q 'statically linked' <<<"${info}"
              go version -m "${path}" | grep -q 'CGO_ENABLED=0'
              # Go >= 1.27 no longer records -ldflags in the build info, so check the linked
              # version string itself (needs "var version" in package main, set via -X).
              if ! grep -aqF -- "${version}" "${path}"; then
                echo "::error::${path} does not contain version ${version} (declare 'var version' in package main)"
                exit 1
              fi
              if [ "${name}" = panel ]; then
                grep -aq '/assets/index-' "${path}"
              fi
            done
          for arch in amd64 arm64; do
            set -- dist/mc-panel_*_linux_"${arch}".tar.gz
            if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
              echo "::error::expected exactly one archive for ${arch}"
              exit 1
            fi
            # The binaries plus the templates the installer uses with --from-dir (installer spec §3)
            # and the AGPL license text at the root.
            contents="$(tar -tzf "$1" | sort)"
            for want in agent files panel LICENSE deploy/systemd/mcpanel-panel.socket deploy/config/panel.toml; do
              if ! grep -qx "${want}" <<<"${contents}"; then
                echo "::error::$1 lacks ${want} (contents: $(paste -sd' ' <<<"${contents}"))"
                exit 1
              fi
            done
          done
          # install.sh is a release asset outside dist/ (build/, assembled by the before hook).
          (cd dist && sha256sum -c --ignore-missing checksums.txt)
          want="$(sha256sum build/install.sh | awk '{ print $1 }')"
          if ! grep -qx "${want}  install.sh" dist/checksums.txt; then
            echo "::error::checksums.txt has no matching entry for install.sh"
            exit 1
          fi
          grep -qx "MCPANEL_VERSION=${version}" build/install.sh

  installer-lint:
    name: Installer (shellcheck, Bash tests)
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assemble
        run: make installer INSTALLER_VERSION=0.0.0-ci

      # shellcheck comes with the runner image.
      - name: shellcheck
        run: shellcheck --version && shellcheck -x scripts/install/*.sh scripts/install/tests/*.sh build/install.sh scripts/ci-installer.sh scripts/install-golangci-lint.sh scripts/testvm-deploy.sh scripts/sign-release.sh scripts/verify-release-build.sh scripts/release-lib.sh

      - name: Bash tests
        run: bash scripts/install/test.sh

  installer:
    name: Installer lifecycle (root)
    needs: changes
    if: needs.changes.outputs.installer_root == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Install (tls internal, firewall on), doctor, idempotence, sign-in through Caddy, update,
      # update with a broken panel (automatic rollback), uninstall (data kept, foreign objects
      # untouched), reinstall over the data, uninstall --purge with the typed domain. Ubuntu
      # 24.04 only with MCPANEL_INSTALL_ALLOW_UNSUPPORTED=1 (set by the script); its restic is
      # 0.16, so the script installs the pinned restic first. The script builds the three
      # staging versions itself (Go caches of setup-go); the panel is built without the web
      # build: the checks use /api only.
      - name: Installer lifecycle
        run: sudo env "PATH=$PATH" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)" scripts/ci-installer.sh .

  # The one result to wait for (gh pr checks): green when every job either passed or was not
  # needed for this change. It only reads `needs` (no checkout).
  ci-ok:
    name: CI OK
    if: always()
    needs:
      - changes
      - go
      - web
      - openapi
      - e2e
      - nftables
      - instances
      - build
      - installer-lint
      - installer
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All needed jobs passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"${NEEDS}"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"${NEEDS}" > /dev/null
