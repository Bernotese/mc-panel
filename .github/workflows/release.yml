name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # Lint and tests on a fresh GitHub-hosted runner with read access only; the release job below
  # builds and publishes on another fresh runner.
  verify:
    name: Lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Only commits that are on main may be released. fetch-depth 0 above fetched every
      # branch, so origin/main exists without needing credentials in this step.
      - name: Verify tagged commit is on main
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null; then
            echo "::error::origin/main not found in the checkout - cannot verify the tagged commit"
            exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main; then
            echo "::error::tagged commit ${GITHUB_SHA} is not on main - refusing to release"
            exit 1
          fi
          echo "tagged commit ${GITHUB_SHA} is an ancestor of origin/main"

      # install.sh trusts exactly the keys in scripts/install/release-signers (SEC-07): never
      # release with the TEST-ONLY placeholder or without a valid key.
      - name: Release key is not the test key
        run: bash scripts/install/test.sh signers_production

      # No caches in release builds: a cache written by a PR run must never feed a release.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # No dependency lifecycle scripts in the release workflow (the release job holds a write token).
      # The build does not need any (the only one, msw's postinstall, refreshes the dev-only
      # mock service worker).
      - name: Install web dependencies
        working-directory: web
        run: npm ci --ignore-scripts

      # The pinned release archive, checked against its checksums.txt (same script and version as
      # ci.yml and make test-vm); no action, so no GITHUB_TOKEN is involved.
      - name: Install golangci-lint
        run: |
          bash scripts/install-golangci-lint.sh "${RUNNER_TEMP}/bin"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      # restic for the backup integration tests of the files service (pinned, SHA-256 checked).
      - name: Install restic
        run: sudo bash scripts/install-restic.sh

      - name: Lint
        run: make lint

      - name: Tests
        env:
          MCPANEL_TEST_RESTIC: /usr/local/bin/restic
        run: |
          umask 022
          make test

      - name: Race tests
        env:
          MCPANEL_TEST_RESTIC: /usr/local/bin/restic
        run: |
          umask 022
          make test-race

  # GoReleaser creates the release as a draft (.goreleaser.yaml). It is published only by
  # make sign-release on the owner's machine, which adds checksums.txt.sig signed with the
  # release key that never touches GitHub (docs/dev/README.md, "Release process").
  release:
    name: GoReleaser
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Only commits that are on main may be released. fetch-depth 0 above fetched every
      # branch, so origin/main exists without needing credentials in this step.
      - name: Verify tagged commit is on main
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null; then
            echo "::error::origin/main not found in the checkout - cannot verify the tagged commit"
            exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main; then
            echo "::error::tagged commit ${GITHUB_SHA} is not on main - refusing to release"
            exit 1
          fi
          echo "tagged commit ${GITHUB_SHA} is an ancestor of origin/main"

      # No caches in release builds: a cache written by a PR run must never feed a release.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # No dependency lifecycle scripts in the release workflow (the release job holds a write token).
      # The build does not need any (the only one, msw's postinstall, refreshes the dev-only
      # mock service worker).
      - name: Install web dependencies
        working-directory: web
        run: npm ci --ignore-scripts

      # Built here, without GITHUB_TOKEN in the environment, so npm/Vite code never sees it.
      # GoReleaser then runs with --skip=before; its post-build hook still fails the release
      # if the frontend is not embedded.
      - name: Build frontend
        run: make web-build

      # The installer is a release asset of its own (.goreleaser.yaml, before hook skipped).
      - name: Assemble the installer
        run: make installer INSTALLER_VERSION="${GITHUB_REF_NAME#v}"

      # GoReleaser builds and publishes in one step; the post hooks of the panel build in
      # .goreleaser.yaml run between the two and fail the release if a binary is not static, has
      # no embedded UI or contains the acceptance time scale (MCPANEL_ACCEPTANCE, build tag
      # acceptance of the instance acceptance in CI).
      - name: GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean --skip=before
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
