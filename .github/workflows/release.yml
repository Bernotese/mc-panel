name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    name: GoReleaser
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Only commits that are on main may be released. fetch-depth 0 above fetched every
      # branch, so origin/main exists without needing credentials in this step.
      - name: Verify tagged commit is on main
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null; then
            echo "::error::origin/main not found in the checkout - cannot verify the tagged commit"
            exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main; then
            echo "::error::tagged commit ${GITHUB_SHA} is not on main - refusing to release"
            exit 1
          fi
          echo "tagged commit ${GITHUB_SHA} is an ancestor of origin/main"

      # No caches in release builds: a cache written by a PR run must never feed a release.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # No dependency lifecycle scripts in the release job (this job holds a write token).
      # The build does not need any (the only one, msw's postinstall, refreshes the dev-only
      # mock service worker).
      - name: Install web dependencies
        working-directory: web
        run: npm ci --ignore-scripts

      # golangci-lint is built from source with the Go toolchain (module proxy + checksum DB)
      # rather than via an action, so no GITHUB_TOKEN is involved. Same version as ci.yml.
      - name: Install golangci-lint
        run: |
          set -euo pipefail
          GOBIN="${RUNNER_TEMP}/bin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Lint
        run: make lint

      - name: Tests
        run: make test

      - name: Race tests
        run: make test-race

      # Built here, without GITHUB_TOKEN in the environment, so npm/Vite code never sees it.
      # GoReleaser then runs with --skip=before; its post-build hook still fails the release
      # if the frontend is not embedded.
      - name: Build frontend
        run: make web-build

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean --skip=before
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
