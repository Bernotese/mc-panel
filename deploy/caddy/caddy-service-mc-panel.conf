# Managed by mc-panel install.sh {{VERSION}}; install.sh update rewrites this file.
# Drop-in for caddy.service (/etc/systemd/system/caddy.service.d/mc-panel.conf):
# - /run/caddy holds Caddy's admin socket (global option "admin unix//run/caddy/admin.sock" in a
#   Caddyfile of the installer); Caddy creates it with mode 0200, so only caddy and root can
#   reconfigure Caddy, not every local user as with 127.0.0.1:2019.
# - /var/log/caddy holds the panel's access log (mc-panel.caddy), readable by caddy and root only.
[Service]
RuntimeDirectory=caddy
RuntimeDirectoryMode=0750
LogsDirectory=caddy
LogsDirectoryMode=0750
