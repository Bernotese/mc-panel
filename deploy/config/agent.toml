# Created by mc-panel install.sh {{VERSION}}. Later runs only add missing keys; your edits stay.
socket = "/run/mc-panel/agent.sock"
panel_uid = {{PANEL_UID}}
firewall = "nftables"
instances_dir = "{{INSTANCES_DIR}}"
mc_user = "mcpanel-mc"
# Web interfaces of the servers (docs/install.md, "Web interfaces"): the container mcpanel-web
# listens on 127.0.0.1 on these ports (proxy, certificate ask). install.sh renders the same values
# into /etc/caddy/mc-panel-web.caddy and the Caddyfile; after a change run install.sh update --force.
web_proxy_port = {{WEB_PROXY_PORT}}
web_ask_port = {{WEB_ASK_PORT}}
# Optional keys (docs/install.md): container_egress_deny (default: link-local, RFC 1918, CGNAT,
# IPv6 ULA and link-local; [] turns the filter off), router_connection_rate_limit (default 50),
# cpu_per_instance (default 0 = no cap), instance_network_pool (default "10.213.0.0/16", one /28 per
# server network).
