    OverviewServer:
      type: object
      required: [id, up, players, players_max, tps, cpu_percent, memory_bytes, memory_limit_bytes, sparkline, alerts]
      properties:
        id: { type: integer, format: int64 }
        up: { type: [boolean, 'null'] }
        players: { type: [integer, 'null'] }
        players_max: { type: [integer, 'null'] }
        tps: { type: [number, 'null'] }
        cpu_percent: { type: [number, 'null'] }
        memory_bytes: { type: [integer, 'null'], format: int64 }
        memory_limit_bytes: { type: [integer, 'null'], format: int64 }
        sparkline: { type: array, items: { $ref: '#/components/schemas/SparklinePoint' }, maxItems: 120 }
        alerts: { type: array, items: { $ref: '#/components/schemas/AlertKind' } }
    HostSnapshot:
      type: object
      required: [at, cpu_percent, load1, memory_used, memory_total, disk_free, disk_total, alerts]
      properties:
        at: { type: [integer, 'null'], format: int64 }
        cpu_percent: { type: [number, 'null'] }
        load1: { type: [number, 'null'] }
        memory_used: { type: [integer, 'null'], format: int64 }
        memory_total: { type: [integer, 'null'], format: int64 }
        disk_free: { type: [integer, 'null'], format: int64 }
        disk_total: { type: [integer, 'null'], format: int64 }
        alerts: { type: array, items: { $ref: '#/components/schemas/AlertKind' } }
    MonitoringOverview:
      type: object
      required: [servers, host]
      properties:
        servers: { type: array, items: { $ref: '#/components/schemas/OverviewServer' } }
        host: { anyOf: [{ $ref: '#/components/schemas/HostSnapshot' }, { type: 'null' }], description: 'null for non-admins' }
    FiringAlert:
      type: object
      required: [kind, server_id, server_name, since, detail]
      properties:
        kind: { $ref: '#/components/schemas/AlertKind' }
        server_id: { type: [integer, 'null'], format: int64 }
        server_name: { type: [string, 'null'] }
        since: { type: integer, format: int64 }
        detail: { type: string }
    MonitoringSettings:
      type: object
      required: [disk_min_percent, disk_min_bytes, down_after_min, crash_restarts, crash_window_min, alerts]
      properties:
        disk_min_percent: { type: integer, minimum: 1, maximum: 50 }
        disk_min_bytes: { type: integer, format: int64, minimum: 1073741824, maximum: 10995116277760 }
        down_after_min: { type: integer, minimum: 1, maximum: 60 }
        crash_restarts: { type: integer, minimum: 2, maximum: 20 }
        crash_window_min: { type: integer, minimum: 1, maximum: 120 }
        alerts: { type: array, items: { $ref: '#/components/schemas/FiringAlert' } }
    UpdateMonitoringSettingsRequest:
      type: object
      additionalProperties: false
      required: [disk_min_percent, disk_min_bytes, down_after_min, crash_restarts, crash_window_min]
      properties:
        disk_min_percent: { type: integer, minimum: 1, maximum: 50 }
        disk_min_bytes: { type: integer, format: int64, minimum: 1073741824, maximum: 10995116277760 }
        down_after_min: { type: integer, minimum: 1, maximum: 60 }
        crash_restarts: { type: integer, minimum: 2, maximum: 20 }
        crash_window_min: { type: integer, minimum: 1, maximum: 120 }
    UpdateServerAlertsRequest:
      type: object
      additionalProperties: false
      required: [down_alerts]
      properties:
        down_alerts: { type: boolean }
    PermissionGrant:
      type: object
      required: [server_id, permissions]
      properties:
        server_id: { type: integer, format: int64 }
        permissions: { type: array, items: { $ref: '#/components/schemas/Permission' } }
    UserPermissions:
      type: object
      required: [grants]
      properties: { grants: { type: array, items: { $ref: '#/components/schemas/PermissionGrant' } } }
    AuditEntry:
      type: object
      required: [id, ts, actor_type, actor_id, actor_name, action, target, ip, result, details, hash]
      properties:
        id: { type: integer, format: int64 }
        ts: { type: integer, format: int64 }
        actor_type: { type: string, enum: [user, system, cli] }
        actor_id: { type: [integer, "null"], format: int64 }
        actor_name: { type: string }
        action: { type: string }
        target: { type: string }
        ip: { type: string }
        result: { type: string, enum: [success, failure, denied] }
        details: { type: object, additionalProperties: true }
        hash: { type: string }
    AuditPage:
      type: object
      required: [items, next_cursor]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }, next_cursor: { type: [string, "null"] } }
    AuditVerify:
      type: object
      required: [ok, checked, first_bad_id]
      properties: { ok: { type: boolean }, checked: { type: integer }, first_bad_id: { type: [integer, "null"], format: int64 } }
    SeriesPoint:
      type: object
      required: [t, success, failure]
      properties: { t: { type: integer, format: int64 }, success: { type: integer }, failure: { type: integer } }
    IPCount:
      type: object
      required: [ip_key, country, failures]
      properties: { ip_key: { type: string }, country: { type: string }, failures: { type: integer } }
    CountryCount:
      type: object
      required: [country, failures]
      properties: { country: { type: string }, failures: { type: integer } }
    NewDeviceLogin:
      type: object
      required: [ts, username, ip, country, user_agent]
      properties: { ts: { type: integer, format: int64 }, username: { type: string }, ip: { type: string }, country: { type: string }, user_agent: { type: string } }
    SecurityOverview:
      type: object
      required: [range, series, top_ips, top_countries, active_jails, failures_total, new_device_logins]
      properties:
        range: { type: string, enum: [24h, 7d, 30d] }
        series: { type: array, items: { $ref: '#/components/schemas/SeriesPoint' } }
        top_ips: { type: array, items: { $ref: '#/components/schemas/IPCount' } }
        top_countries: { type: array, items: { $ref: '#/components/schemas/CountryCount' } }
        active_jails: { type: integer }
        failures_total: { type: integer }
        new_device_logins: { type: array, items: { $ref: '#/components/schemas/NewDeviceLogin' } }
    LoginAttempt:
      type: object
      required: [id, ts, ip, username, stage, success, reason, country, user_agent]
      properties:
        id: { type: integer, format: int64 }
        ts: { type: integer, format: int64 }
        ip: { type: string }
        username: { type: string }
        stage: { type: string, enum: [password, totp, webauthn, recovery, sudo] }
        success: { type: boolean }
        reason: { type: string }
        country: { type: string }
        user_agent: { type: string }
    LoginAttemptPage:
      type: object
      required: [items, next_cursor]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/LoginAttempt' } }, next_cursor: { type: [string, "null"] } }
    Jail:
      type: object
      required: [id, ip_key, reason, level, manual, created_at, expires_at, lifted_at, lifted_by, firewall_synced]
      properties:
        id: { type: integer, format: int64 }
        ip_key: { type: string }
        reason: { type: string }
        level: { type: integer }
        manual: { type: boolean }
        created_at: { type: integer, format: int64 }
        expires_at: { type: integer, format: int64 }
        lifted_at: { type: [integer, "null"], format: int64 }
        lifted_by: { type: [string, "null"] }
        firewall_synced: { type: boolean }
    CreateJailRequest:
      type: object
      required: [ip, duration_minutes, reason]
      properties:
        ip: { type: string, description: IP address; normalized to /32 or /64 }
        duration_minutes: { type: integer, minimum: 1, maximum: 10080 }
        reason: { type: string, maxLength: 200 }
    IPRule:
      type: object
      required: [id, cidr, kind, comment, expires_at, created_by, created_at]
      properties:
        id: { type: integer, format: int64 }
        cidr: { type: string }
        kind: { type: string, enum: [allow, deny] }
        comment: { type: string }
        expires_at: { type: [integer, "null"], format: int64 }
        created_by: { type: string }
        created_at: { type: integer, format: int64 }
    CreateIPRuleRequest:
      type: object
      required: [cidr, kind, comment]
      properties:
        cidr:
          type: string
          description: >-
            IPv4/IPv6 address or network. Allow rules cover at most a /8 (IPv4) or /32 (IPv6);
            deny rules must not cover loopback (127.0.0.0/8, ::1), which Caddy and the installer's
            health checks use (400 validation_failed).
        kind: { type: string, enum: [allow, deny] }
        comment: { type: string, maxLength: 200 }
        expires_at: { type: [integer, "null"], format: int64 }
    SecuritySettings:
      type: object
      required: [enforce_2fa_for_users, admin_allowlist_only, allowed_countries]
      properties:
        enforce_2fa_for_users: { type: boolean }
        admin_allowlist_only: { type: boolean }
        allowed_countries: { type: array, items: { type: string, pattern: '^[A-Z]{2}$' } }
    SecuritySettingsResponse:
      allOf:
        - $ref: '#/components/schemas/SecuritySettings'
        - type: object
          required: [geoip_available]
          properties: { geoip_available: { type: boolean } }
    Notifier:
      type: object
      required: [id, kind, name, enabled, target_masked, created_at]
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string, enum: [discord, ntfy] }
        name: { type: string }
        enabled: { type: boolean }
        target_masked: { type: string, description: 'e.g. https://discord.com/api/webhooks/…/****' }
        created_at: { type: integer, format: int64 }
    CreateNotifierRequest:
      type: object
      required: [kind, name, enabled, url]
      properties:
        kind: { type: string, enum: [discord, ntfy] }
        name: { type: string, minLength: 1, maxLength: 64 }
        enabled: { type: boolean }
        url: { type: string, description: 'discord: webhook URL; ntfy: server base URL' }
        topic: { type: string, description: ntfy only }
        token: { type: string, description: ntfy access token (optional) }
    UpdateNotifierRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        enabled: { type: boolean }
        url: { type: string }
        topic: { type: string }
        token: { type: string }
    AgentStatus:
      type: object
      required: [reachable, firewall, version, pending_sync]
      properties:
        reachable: { type: boolean }
        firewall: { type: string }
        version: { type: string }
        pending_sync: { type: integer }
    Health:
      type: object
      required: [status]
      properties: { status: { type: string, enum: [ok] } }
