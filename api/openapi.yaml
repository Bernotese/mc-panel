      description: 'A file entry of modrinth.index.json; unknown fields are ignored'
      properties:
        path: { type: string, minLength: 1, maxLength: 255, description: 'Relative, no "..", no backslash, no leading slash, no control characters; only mods/<name>.jar is used' }
        hashes:
          type: object
          required: [sha512]
          properties:
            sha512: { type: string, pattern: '^[0-9A-Fa-f]{128}$' }
            sha1: { type: string, pattern: '^[0-9A-Fa-f]{40}$' }
        env:
          type: object
          properties:
            client: { $ref: '#/components/schemas/MrpackEnvSide' }
            server: { $ref: '#/components/schemas/MrpackEnvSide' }
        downloads: { type: array, items: { type: string }, description: Ignored }
        fileSize: { type: integer, format: int64, description: Ignored }
    MrpackIndex:
      type: object
      required: [formatVersion, game, name, files, dependencies]
      description: 'modrinth.index.json of a .mrpack (camelCase like the file); unknown fields are ignored because the format may grow'
      properties:
        formatVersion: { type: integer, enum: [1] }
        game: { type: string, enum: [minecraft] }
        versionId: { type: string, maxLength: 128 }
        name: { type: string, minLength: 1, maxLength: 128 }
        summary: { type: string, description: Ignored }
        files: { type: array, maxItems: 2000, items: { $ref: '#/components/schemas/MrpackFile' }, description: 'sha512 and target names (case-insensitive) must be unique' }
        dependencies:
          type: object
          description: 'minecraft (required) and one loader; keys only minecraft, fabric-loader, neoforge, forge, quilt-loader; versions ^[0-9A-Za-z][0-9A-Za-z.+_-]{0,63}$'
          additionalProperties: { type: string }
    MrpackImportRequest:
      type: object
      additionalProperties: false
      required: [index, exclude, accept_mismatch]
      properties:
        index: { $ref: '#/components/schemas/MrpackIndex' }
        exclude: { type: array, maxItems: 2000, items: { type: string, pattern: '^[0-9A-Fa-f]{128}$' }, description: 'sha512 of optional entries not to install' }
        accept_mismatch: { type: boolean, description: 'Import although version_mismatch is true' }
    MrpackAction: { type: string, enum: [install, update, unchanged, skip] }
    MrpackSkipReason: { type: string, enum: [client_only, not_on_modrinth, incompatible, file_exists] }
    MrpackPlanEntry:
      type: object
      required: [file, sha512, action, reason, optional, project, version, replaces]
      properties:
        file: { type: string, description: 'install: the target file name (the name from the pack, or <slug>-<version>.jar if that is no valid jar name); update: the target name, with .disabled if the replaced jar is disabled; unchanged: the installed jar; skip: the name as in the pack (not_on_modrinth: to upload it by hand)' }
        sha512: { type: string, description: 'Lowercase hex, the key for exclude' }
        action: { $ref: '#/components/schemas/MrpackAction' }
        reason: { anyOf: [{ $ref: '#/components/schemas/MrpackSkipReason' }, { type: 'null' }], description: 'Set for skip, else null' }
        optional: { type: boolean, description: 'env.server is optional: preselected, may be excluded' }
        project: { anyOf: [{ $ref: '#/components/schemas/PluginProjectRef' }, { type: 'null' }], description: 'null if Modrinth does not know the file' }
        version: { anyOf: [{ $ref: '#/components/schemas/PluginVersionRef' }, { type: 'null' }], description: 'Pack version of the mod; null if Modrinth does not know the file' }
        replaces: { type: [string, 'null'], description: 'update: the installed jar that is replaced (its .disabled stays); else null' }
    MrpackPlan:
      type: object
      required: [pack, game_version, loader, version_mismatch, entries, kept, ignored_files]
      properties:
        pack:
          type: object
          required: [name, version_id]
          properties:
            name: { type: string }
            version_id: { type: string }
        game_version:
          type: object
          required: [pack, server]
          properties:
            pack: { type: string }
            server: { type: string, description: 'Game version of the instance (LATEST resolved)' }
        loader:
          type: object
          required: [name, pack, server]
          properties:
            name: { type: string, enum: [fabric, neoforge] }
            pack: { type: string, description: 'Loader version of the pack' }
            server: { type: [string, 'null'], description: 'Fixed loader version of the instance; null = newest (never a mismatch)' }
        version_mismatch: { type: boolean, description: 'The Minecraft version differs, or the loader version differs from a fixed one; the import then needs accept_mismatch' }
        entries: { type: array, items: { $ref: '#/components/schemas/MrpackPlanEntry' }, description: 'One per mod of the pack, in pack order' }
        kept: { type: array, items: { type: string }, description: 'Jars in mods/ (with .disabled) that no entry matches or replaces; they stay installed' }
        ignored_files: { type: integer, description: 'Files of the pack outside mods/<name>.jar (configs, resource packs, ...)' }
