openapi: 3.1.0
info:
  title: mc-panel API
  version: 0.1.0
servers:
  - url: /api
security:
  - session: []
tags:
  - { name: health, description: 'Health check (public)' }
  - { name: auth, description: 'Login, second factor and sudo' }
  - { name: me, description: 'Current user: profile, 2FA, sessions' }
  - { name: admin, description: 'Admin-only session management' }
  - { name: users, description: 'User management' }
  - { name: servers, description: 'Servers and power control' }
  - { name: console, description: 'Live console: log stream, RCON commands, players' }
  - { name: files, description: 'File browser of a server: list, edit, upload, download, manage, extract' }
  - { name: plugins, description: 'Plugins and mods of a server: inventory, search in Modrinth and Hangar, install, update, toggle, remove' }
  - { name: audit, description: 'Audit log' }
  - { name: security, description: 'Security center: attempts, jails, IP rules, settings, notifiers, agent' }
paths:
  /health:
    get:
      operationId: getHealth
      tags: [health]
      security: []
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } } }
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      parameters:
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204': { description: No content }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/2fa/totp:
    post:
      operationId: verifyTotp
      tags: [auth]
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CodeRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/2fa/recovery:
    post:
      operationId: verifyRecovery
      tags: [auth]
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CodeRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/2fa/webauthn/begin:
    post:
      operationId: beginWebAuthnLogin
      tags: [auth]
      parameters:
        - $ref: '#/components/parameters/CSRF'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/WebAuthnOptions' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /auth/2fa/webauthn/finish:
    post:
      operationId: finishWebAuthnLogin
      tags: [auth]
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WebAuthnAssertion' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/sudo/totp:
    post:
      operationId: sudoTotp
      tags: [auth]
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CodeRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SudoResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/sudo/webauthn/begin:
    post:
      operationId: beginSudoWebAuthn
      tags: [auth]
      parameters:
        - $ref: '#/components/parameters/CSRF'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/WebAuthnOptions' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /auth/sudo/webauthn/finish:
    post:
      operationId: finishSudoWebAuthn
      tags: [auth]
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WebAuthnAssertion' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SudoResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /me:
    patch:
      operationId: updateMe
      tags: [me]
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateMeRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/password:
    post:
      operationId: changePassword
      tags: [me]
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PasswordChangeRequest' } } }
      responses:
        '204': { description: No content }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /me/totp/setup:
    post:
      operationId: setupTotp
      tags: [me]
      parameters:
        - $ref: '#/components/parameters/CSRF'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TotpSetupResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /me/totp/enable:
    post:
      operationId: enableTotp
      tags: [me]
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CodeRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RecoveryCodesResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /me/totp:
    delete:
      operationId: disableTotp
      tags: [me]
      parameters:
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204': { description: No content }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /me/passkeys/begin:
    post:
      operationId: beginPasskeyRegistration
      tags: [me]
      parameters:
        - $ref: '#/components/parameters/CSRF'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/WebAuthnOptions' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /me/passkeys/finish:
    post:
      operationId: finishPasskeyRegistration
      tags: [me]
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PasskeyRegistration' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/PasskeyCreated' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/passkeys:
    get:
      operationId: listPasskeys
      tags: [me]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Passkey' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/passkeys/{id}:
    delete:
      operationId: deletePasskey
      tags: [me]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204': { description: No content }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /me/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      tags: [me]
      parameters:
        - $ref: '#/components/parameters/CSRF'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RecoveryCodesResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /me/sessions:
    get:
      operationId: listMySessions
      tags: [me]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Session' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/sessions/{id}:
    delete:
      operationId: revokeMySession
      tags: [me]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204': { description: No content }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/sessions/revoke-others:
    post:
      operationId: revokeOtherSessions
      tags: [me]
      parameters:
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204': { description: No content }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /admin/sessions:
    get:
      operationId: listAllSessions
      tags: [admin]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Session' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/sessions/{id}:
    delete:
      operationId: revokeAnySession
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204': { description: No content }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /users:
    get:
      operationId: listUsers
      tags: [users]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/User' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createUser
      tags: [users]
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateUserRequest' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateUser
      tags: [users]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateUserRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      operationId: deleteUser
      tags: [users]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204': { description: No content }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /users/{id}/reset-2fa:
    post:
      operationId: resetUser2fa
      tags: [users]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204': { description: No content }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /users/{id}/permissions:
    get:
      operationId: getUserPermissions
      tags: [users]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/UserPermissions' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: setUserPermissions
      tags: [users]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UserPermissions' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/UserPermissions' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /servers:
    get:
      operationId: listServers
      tags: [servers]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Server' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createServer
      tags: [servers]
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateServerRequest' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Server' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 'conflict (name taken) or base_domain_missing', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /servers/catalog/{type}:
    get:
      operationId: getServerCatalog
      tags: [servers]
      parameters:
        - { name: type, in: path, required: true, schema: { $ref: '#/components/schemas/InstanceType' } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Catalog' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 'No catalog for modrinth/curseforge (the pack decides the version)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '502': { description: 'catalog_unavailable: upstream not reachable or invalid; the form falls back to free text', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /servers/settings:
    get:
      operationId: getServerSettings
      tags: [servers]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ServerSettings' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      operationId: updateServerSettings
      tags: [servers]
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateServerSettingsRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ServerSettings' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /servers/{id}:
    get:
      operationId: getServer
      tags: [servers]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Server' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateServer
      tags: [servers]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateServerRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Server' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteServer
      tags: [servers]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204': { description: No content }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /servers/{id}/power:
    post:
      operationId: serverPower
      tags: [servers]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PowerRequest' } } }
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/PowerResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'conflict (server not configured, restart of a container that belongs to another server, or a job rewrites the data directory: an archive is extracted or a backup restored) or base_domain_missing (restart)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /servers/{id}/console/stream:
    get:
      operationId: streamConsole
      tags: [console]
      summary: Live log of the server (Server-Sent Events)
      description: |
        `text/event-stream`, kept open across container restarts. Events:

        - `line` with `id: <Docker timestamp in ns>` and `data: {"ts": <unix ms>, "stream": "out"|"err", "line": "…"}`
        - `state` with `data: {"running": true|false}` – the container log stream (re)opened or ended
        - comment `: ping` every 15 s

        With `Last-Event-ID` the stream resumes after that line; otherwise it starts with the last `tail` lines.
        The panel re-checks session and permission every 30 s and closes the stream when either is gone.
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - { name: tail, in: query, required: false, schema: { type: integer, minimum: 0, maximum: 1000, default: 500 } }
      responses:
        '200': { description: Event stream, content: { text/event-stream: { schema: { type: string } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /servers/{id}/console:
    post:
      operationId: sendConsoleCommand
      tags: [console]
      summary: Run a console command over RCON (audited)
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ConsoleCommandRequest' } } }
      responses:
        '200': { description: RCON output, content: { application/json: { schema: { $ref: '#/components/schemas/ConsoleCommandResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: instance_not_running, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /servers/{id}/players:
    get:
      operationId: getOnlinePlayers
      tags: [console]
      summary: Players currently online (cached for 10 s)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OnlinePlayers' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /servers/{id}/players/lists:
    get:
      operationId: getPlayerLists
      tags: [console]
      summary: Ops, whitelist and bans as kept by the server (readable while stopped)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PlayerLists' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /servers/{id}/players/actions:
    post:
      operationId: playerAction
      tags: [console]
      summary: Kick, ban, pardon, op, deop or change the whitelist (audited)
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PlayerActionRequest' } } }
      responses:
        '200': { description: RCON output, content: { application/json: { schema: { $ref: '#/components/schemas/ConsoleCommandResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: instance_not_running, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /servers/{id}/files:
    get:
      operationId: listFiles
      tags: [files]
      summary: List a directory of the server's data
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/FilePathQuery'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/FileList' } } } }
        '400': { description: 'validation_failed or not_regular (not a directory)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /servers/{id}/files/content:
    get:
      operationId: readFile
      tags: [files]
      summary: Read a text file for the editor (rcon.password redacted)
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/FilePathQueryRequired'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/FileContent' } } } }
        '400': { description: 'validation_failed or not_regular', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '415': { description: not_text (too large for the editor or not text), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    put:
      operationId: writeFile
      tags: [files]
      summary: Save a text file (atomic, with conflict check; audited)
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WriteFileRequest' } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/FileWriteResult' } } } }
        '400': { description: 'validation_failed or not_regular', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'file_exists (new file) or file_modified (changed since it was opened)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '413': { description: payload_too_large, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '507': { $ref: '#/components/responses/InsufficientStorage' }
  /servers/{id}/files/upload:
    post:
      operationId: uploadFile
      tags: [files]
      summary: Upload one file as a raw stream (up to 4 GiB; audited)
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/CSRF'
        - $ref: '#/components/parameters/FilePathQueryRequired'
        - { name: overwrite, in: query, required: false, schema: { type: boolean, default: false } }
      requestBody:
        required: true
        content: { application/octet-stream: { schema: { type: string, format: binary } } }
      responses:
        '201': { description: Uploaded, content: { application/json: { schema: { $ref: '#/components/schemas/UploadResult' } } } }
        '400': { description: 'validation_failed (also without Content-Length) or not_regular', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: file_exists (without overwrite), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '413': { description: payload_too_large, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '507': { $ref: '#/components/responses/InsufficientStorage' }
  /servers/{id}/files/download:
    get:
      operationId: downloadFile
      tags: [files]
      summary: Download a file, or a directory as a zip stream (audited)
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/FilePathQuery'
      responses:
        '200':
          description: File or zip stream with Content-Disposition attachment
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
            application/zip: { schema: { type: string, format: binary } }
        '400': { description: 'validation_failed (also a folder whose name cannot be stored in a zip) or not_regular (symlink or special file)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { description: 'payload_too_large (a folder with more entries than max_extract_entries, or a server.properties larger than max_text_bytes that cannot be redacted)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /servers/{id}/files/mkdir:
    post:
      operationId: makeDirectory
      tags: [files]
      summary: Create a directory (audited)
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/FilePathRequest' } } }
      responses:
        '201': { description: Created }
        '400': { description: 'validation_failed or not_regular (a parent is not a folder)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: file_exists, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '413': { description: 'payload_too_large (request exceeds the file service limit)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '507': { $ref: '#/components/responses/InsufficientStorage' }
  /servers/{id}/files/rename:
    post:
      operationId: renameFile
      tags: [files]
      summary: Rename or move a file or directory (audited)
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RenameFileRequest' } } }
      responses:
        '204': { description: Renamed }
        '400': { description: 'validation_failed (e.g. a folder into itself; server.properties cannot be moved) or not_regular (a parent is not a folder)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: file_exists, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '413': { description: 'payload_too_large (request exceeds the file service limit)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '507': { $ref: '#/components/responses/InsufficientStorage' }
  /servers/{id}/files/delete:
    post:
      operationId: deleteFile
      tags: [files]
      summary: Delete a file or a directory with its content (audited)
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/FilePathRequest' } } }
      responses:
        '204': { description: Deleted }
        '400': { description: 'validation_failed (e.g. the data directory itself) or not_regular (a parent is not a folder)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { description: 'payload_too_large (request exceeds the file service limit)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /servers/{id}/files/extract:
    post:
      operationId: extractArchive
      tags: [files]
      summary: Start extracting a zip into a new or empty directory (server must be stopped; audited)
      description: The archive is checked before the job starts (entry names, symlinks, encryption, compression, total size and entries, destination, free space); a failed check answers 400/409/413/507 and starts no job.
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ExtractRequest' } } }
      responses:
        '202': { description: Job started, content: { application/json: { schema: { $ref: '#/components/schemas/FileJob' } } } }
        '400': { description: 'validation_failed or not_regular', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'instance_running (server must be stopped) or file_exists (destination not empty)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '413': { description: 'payload_too_large (archive exceeds the size or entry limit)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { description: 'files_unavailable (file service), agent_unavailable (actual state unknown) or docker_unavailable', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '507': { $ref: '#/components/responses/InsufficientStorage' }
  /servers/{id}/files/jobs:
    get:
      operationId: getFileJob
      tags: [files]
      summary: The running or last extract job of the server
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/FileJobResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /servers/{id}/plugins:
    get:
      operationId: listPlugins
      tags: [plugins]
      summary: Installed plugins or mods (jars on disk, matched to their source)
      description: 'Every jar in plugins/ resp. mods/ is matched by the install record of the panel (same name and sha512), else by a Modrinth hash lookup, else it is manual. If Modrinth is unreachable the affected jars stay manual and source_errors names it.'
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PluginInventory' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/PluginsUnsupported' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /servers/{id}/plugins/search:
    get:
      operationId: searchPlugins
      tags: [plugins]
      summary: Search compatible projects of one source (20 per page; the most downloaded without q)
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/PluginSourceQuery'
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 100, default: '' } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, maximum: 1000, default: 0 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PluginSearchResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/PluginsUnsupported' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/PluginSourceUnavailable' }
  /servers/{id}/plugins/versions:
    get:
      operationId: listPluginVersions
      tags: [plugins]
      summary: Compatible versions of a project, newest first (at most 25)
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/PluginSourceQuery'
        - $ref: '#/components/parameters/PluginProjectQuery'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PluginVersionList' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/PluginsUnsupported' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/PluginSourceUnavailable' }
  /servers/{id}/plugins/resolve:
    get:
      operationId: resolvePlugin
      tags: [plugins]
      summary: Preview of an installation with its required dependencies
      description: 'Dependencies without a compatible downloadable version are listed in incompatible (200); the plan is then not installable. Only a problem of the requested project itself answers 409.'
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/PluginSourceQuery'
        - $ref: '#/components/parameters/PluginProjectQuery'
        - { name: version, in: query, required: false, description: 'Modrinth version ID or Hangar version name; omitted = newest compatible release, else newest compatible version', schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9._+-]+$' } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PluginResolution' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'plugins_unsupported, plugin_incompatible (the requested project has no compatible version) or plugin_not_downloadable (the requested version is only available externally)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/PluginSourceUnavailable' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /servers/{id}/plugins/install:
    post:
      operationId: installPlugin
      tags: [plugins]
      summary: Start a job that installs a project with its required dependencies (audited per jar)
      description: The plan is computed again (the preview is not trusted). Dependencies are installed first; a failed step ends the job, steps already done stay installed.
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/InstallPluginRequest' } } }
      responses:
        '202': { description: Job started, content: { application/json: { schema: { $ref: '#/components/schemas/PluginJob' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'plugins_unsupported, conflict (a plugin job of this server is running, or the requested project is already installed in this version), plugin_incompatible (the plan has incompatible entries), plugin_not_downloadable (the requested version is only available externally) or file_exists (a target file name belongs to another jar)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/PluginSourceUnavailable' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /servers/{id}/plugins/updates:
    get:
      operationId: getPluginUpdates
      tags: [plugins]
      summary: Available updates of the installed jars (cached for 1 h per server)
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - { name: refresh, in: query, required: false, description: 'true (or 1) bypasses the cache; rate limited', schema: { type: boolean, default: false } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PluginUpdates' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/PluginsUnsupported' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/PluginSourceUnavailable' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /servers/{id}/plugins/update:
    post:
      operationId: updatePlugins
      tags: [plugins]
      summary: Start a job that updates jars (audited per jar)
      description: A failed step does not stop the job; it then ends failed. Disabled jars stay disabled, new required dependencies are installed as well. A file without an available update, or no update at all, is 400 validation_failed.
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdatePluginsRequest' } } }
      responses:
        '202': { description: Job started, content: { application/json: { schema: { $ref: '#/components/schemas/PluginJob' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'plugins_unsupported or conflict (a plugin job of this server is running)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/PluginSourceUnavailable' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /servers/{id}/plugins/toggle:
    post:
      operationId: togglePlugin
      tags: [plugins]
      summary: Enable or disable a jar by renaming it to or from .jar.disabled (audited)
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TogglePluginRequest' } } }
      responses:
        '204': { description: Done (also when the jar already had the requested state) }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'plugins_unsupported, file_exists (a jar with the target name exists) or conflict (a plugin job of this server is running)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /servers/{id}/plugins/delete:
    post:
      operationId: deletePlugin
      tags: [plugins]
      summary: Remove a jar and its install record (audited)
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PluginFileRequest' } } }
      responses:
        '204': { description: Removed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'plugins_unsupported or conflict (a plugin job of this server is running)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /servers/{id}/plugins/jobs:
    get:
      operationId: getPluginJob
      tags: [plugins]
      summary: The running or last plugin job of the server (kept in memory until the next job or a panel restart)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PluginJobResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/PluginsUnsupported' }
  /servers/{id}/plugins/icon:
    get:
      operationId: getPluginIcon
      tags: [plugins]
      summary: Project icon through the panel (CSP img-src self); only from cdn.modrinth.com and hangarcdn.papermc.io
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - { name: url, in: query, required: true, description: 'https://cdn.modrinth.com/... or https://hangarcdn.papermc.io/...', schema: { type: string, minLength: 1, maxLength: 512 } }
      responses:
        '200':
          description: 'The image with its detected Content-Type (Cache-Control: private, max-age=86400; X-Content-Type-Options: nosniff)'
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { description: 'plugin_source_unavailable (fetch failed, larger than 256 KiB or not a PNG, JPEG, WebP or GIF image)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /audit:
    get:
      operationId: listAudit
      tags: [audit]
      parameters:
        - { name: actor, in: query, required: false, schema: { type: string } }
        - { name: action, in: query, required: false, schema: { type: string } }
        - { name: result, in: query, required: false, schema: { type: string, enum: [success, failure, denied] } }
        - { name: from, in: query, required: false, schema: { type: integer, format: int64 } }
        - { name: to, in: query, required: false, schema: { type: integer, format: int64 } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuditPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /audit/verify:
    get:
      operationId: verifyAudit
      tags: [audit]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuditVerify' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /security/overview:
    get:
      operationId: getSecurityOverview
      tags: [security]
      parameters:
        - { name: range, in: query, required: false, schema: { type: string, enum: [24h, 7d, 30d], default: 24h } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SecurityOverview' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /security/attempts:
    get:
      operationId: listLoginAttempts
      tags: [security]
      parameters:
        - { name: success, in: query, required: false, schema: { type: boolean } }
        - { name: ip, in: query, required: false, schema: { type: string } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/LoginAttemptPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /security/jails:
    get:
      operationId: listJails
      tags: [security]
      parameters:
        - { name: active, in: query, required: false, schema: { type: boolean, default: true } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Jail' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createJail
      tags: [security]
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateJailRequest' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Jail' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /security/jails/{id}:
    delete:
      operationId: liftJail
      tags: [security]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204': { description: No content }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /security/ip-rules:
    get:
      operationId: listIPRules
      tags: [security]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/IPRule' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createIPRule
      tags: [security]
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateIPRuleRequest' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/IPRule' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /security/ip-rules/{id}:
    delete:
      operationId: deleteIPRule
      tags: [security]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204': { description: No content }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /security/settings:
    get:
      operationId: getSecuritySettings
      tags: [security]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SecuritySettingsResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      operationId: updateSecuritySettings
      tags: [security]
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SecuritySettings' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SecuritySettingsResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /security/notifiers:
    get:
      operationId: listNotifiers
      tags: [security]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Notifier' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createNotifier
      tags: [security]
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateNotifierRequest' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Notifier' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /security/notifiers/{id}:
    patch:
      operationId: updateNotifier
      tags: [security]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateNotifierRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Notifier' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteNotifier
      tags: [security]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204': { description: No content }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /security/notifiers/{id}/test:
    post:
      operationId: testNotifier
      tags: [security]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204': { description: No content }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /security/agent:
    get:
      operationId: getAgentStatus
      tags: [security]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AgentStatus' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: __Host-sid }
  parameters:
    CSRF: { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
    IdPath: { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    Cursor: { name: cursor, in: query, required: false, schema: { type: string } }
    Limit: { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    FilePathQuery: { name: path, in: query, required: false, description: 'Relative path in the data directory; empty = root', schema: { type: string, maxLength: 4096, default: '' } }
    FilePathQueryRequired: { name: path, in: query, required: true, description: 'Relative path in the data directory', schema: { type: string, minLength: 1, maxLength: 4096 } }
    PluginSourceQuery: { name: source, in: query, required: true, description: 'hangar only for plugins (paper, purpur)', schema: { $ref: '#/components/schemas/PluginSource' } }
    PluginProjectQuery: { name: project, in: query, required: true, description: 'Modrinth project ID or slug, Hangar slug or ID', schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9._+-]+$' } }
  responses:
    BadRequest: { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unauthorized: { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden: { description: 'Forbidden (forbidden, sudo_required, setup_2fa_required, csrf_invalid, ip_blocked, jailed)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Conflict: { description: Conflict, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    TooManyRequests: { description: Rate limited (Retry-After header set), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    ServiceUnavailable: { description: 'Agent, Docker, RCON or the files service not available (agent_unavailable, docker_unavailable, rcon_unavailable, files_unavailable)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    InsufficientStorage: { description: insufficient_storage (less than the reserve would be left), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    PluginsUnsupported: { description: 'plugins_unsupported (the server type has no plugins or mods: vanilla and modpacks)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    PluginSourceUnavailable: { description: 'plugin_source_unavailable (Modrinth or Hangar unreachable, rate limited or answering unusably) or catalog_unavailable (the newest game version for LATEST cannot be resolved)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error: { type: string, enum: [bad_request, validation_failed, unauthorized, invalid_credentials, invalid_code, forbidden, sudo_required, setup_2fa_required, csrf_invalid, not_found, conflict, payload_too_large, rate_limited, jailed, ip_blocked, agent_unavailable, docker_unavailable, base_domain_missing, catalog_unavailable, instance_not_running, rcon_unavailable, files_unavailable, file_exists, file_modified, not_text, not_regular, instance_running, insufficient_storage, plugins_unsupported, plugin_source_unavailable, plugin_not_downloadable, plugin_incompatible, internal] }
        message: { type: string }
        request_id: { type: string }
    Role: { type: string, enum: [admin, user] }
    Stage: { type: string, enum: [preauth, setup, full] }
    Locale: { type: string, enum: [de, en] }
    Permission: { type: string, enum: [server.view, server.power, server.console, server.files, server.plugins, server.backups] }
    SecondFactor: { type: string, enum: [totp, webauthn, recovery] }
    Me:
      type: object
      required: [id, username, role, stage, locale, totp_enabled, passkey_count, recovery_codes_remaining, second_factors, sudo_until, csrf_token]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        stage: { $ref: '#/components/schemas/Stage' }
        locale: { $ref: '#/components/schemas/Locale' }
        totp_enabled: { type: boolean }
        passkey_count: { type: integer }
        recovery_codes_remaining: { type: integer }
        second_factors: { type: array, items: { $ref: '#/components/schemas/SecondFactor' }, description: Methods usable in preauth stage }
        sudo_until: { type: integer, format: int64, description: Unix ms; 0 = no sudo }
        csrf_token: { type: string }
    LoginRequest:
      type: object
      required: [username, password]
      properties: { username: { type: string, maxLength: 64 }, password: { type: string, maxLength: 256 } }
    CodeRequest:
      type: object
      required: [code]
      properties: { code: { type: string, maxLength: 32 } }
    WebAuthnOptions: { type: object, additionalProperties: true, description: 'CredentialCreationOptions / CredentialRequestOptions JSON ({publicKey: ...})' }
    WebAuthnAssertion:
      type: object
      required: [credential]
      properties: { credential: { type: object, additionalProperties: true } }
    PasskeyRegistration:
      type: object
      required: [name, credential]
      properties: { name: { type: string, minLength: 1, maxLength: 64 }, credential: { type: object, additionalProperties: true } }
    SudoResponse:
      type: object
      required: [sudo_until]
      properties: { sudo_until: { type: integer, format: int64 } }
    PasswordChangeRequest:
      type: object
      required: [current_password, new_password]
      properties: { current_password: { type: string, maxLength: 256 }, new_password: { type: string, minLength: 12, maxLength: 256 } }
    UpdateMeRequest:
      type: object
      required: [locale]
      properties: { locale: { $ref: '#/components/schemas/Locale' } }
    TotpSetupResponse:
      type: object
      required: [secret, otpauth_url]
      properties: { secret: { type: string }, otpauth_url: { type: string } }
    RecoveryCodesResponse:
      type: object
      required: [codes]
      properties: { codes: { type: array, items: { type: string }, description: Empty if the user already had recovery codes } }
    Passkey:
      type: object
      required: [id, name, created_at, last_used_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        created_at: { type: integer, format: int64 }
        last_used_at: { type: [integer, "null"], format: int64 }
    PasskeyCreated:
      type: object
      required: [passkey, recovery_codes]
      properties: { passkey: { $ref: '#/components/schemas/Passkey' }, recovery_codes: { type: array, items: { type: string } } }
    Session:
      type: object
      required: [id, user_id, username, current, ip, country, user_agent, created_at, last_seen_at, expires_at]
      properties:
        id: { type: integer, format: int64 }
        user_id: { type: integer, format: int64 }
        username: { type: string }
        current: { type: boolean }
        ip: { type: string }
        country: { type: string }
        user_agent: { type: string }
        created_at: { type: integer, format: int64 }
        last_seen_at: { type: integer, format: int64 }
        expires_at: { type: integer, format: int64 }
    User:
      type: object
      required: [id, username, role, totp_enabled, passkey_count, created_at, last_login_at]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        totp_enabled: { type: boolean }
        passkey_count: { type: integer }
        created_at: { type: integer, format: int64 }
        last_login_at: { type: [integer, "null"], format: int64 }
    CreateUserRequest:
      type: object
      required: [username, password, role]
      properties:
        username: { type: string, pattern: '^[a-zA-Z0-9_.-]{3,32}$' }
        password: { type: string, minLength: 12, maxLength: 256 }
        role: { $ref: '#/components/schemas/Role' }
    UpdateUserRequest:
      type: object
      properties:
        role: { $ref: '#/components/schemas/Role' }
        password: { type: string, minLength: 12, maxLength: 256 }
    InstanceType: { type: string, enum: [vanilla, paper, purpur, fabric, neoforge, modrinth, curseforge] }
    JavaVersion: { type: string, enum: [java8, java17, java21, java25] }
    ServerState: { type: string, enum: [not_configured, unknown, creating, starting, running, stopping, stopped, restarting, error] }
    ServerProperties:
      type: object
      additionalProperties: false
      description: Allowlisted server.properties. Ops and the whitelist are managed live via /servers/{id}/players (sub-project 3a).
      properties:
        motd: { type: string, maxLength: 150 }
        difficulty: { type: string, enum: [peaceful, easy, normal, hard] }
        gamemode: { type: string, enum: [survival, creative, adventure, spectator] }
        max_players: { type: integer, minimum: 1, maximum: 500 }
        pvp: { type: boolean }
        hardcore: { type: boolean }
        allow_flight: { type: boolean }
        enable_command_block: { type: boolean }
        online_mode: { type: boolean }
        whitelist_enabled: { type: boolean }
        view_distance: { type: integer, minimum: 3, maximum: 32 }
        simulation_distance: { type: integer, minimum: 3, maximum: 32 }
        spawn_protection: { type: integer, minimum: 0, maximum: 256 }
        seed: { type: string, maxLength: 64 }
        level_type: { type: string, enum: [normal, flat, large_biomes, amplified] }
    InstanceConfig:
      type: object
      required: [type, version, loader_version, modpack, java, memory_mib, properties]
      properties:
        type: { $ref: '#/components/schemas/InstanceType' }
        version: { type: string, description: "'LATEST', a version, or '' for modpacks" }
        loader_version: { type: [string, 'null'] }
        modpack: { type: [string, 'null'] }
        java: { $ref: '#/components/schemas/JavaVersion' }
        memory_mib: { type: integer, minimum: 1024, maximum: 32768, multipleOf: 256 }
        properties: { $ref: '#/components/schemas/ServerProperties', description: All fields set (defaults resolved) }
    ServerStatus:
      type: object
      description: |
        Actual state of the instance as last reported by the agent (contract V4). `state` is the first matching row:

        | Condition | state |
        |---|---|
        | no instance row | not_configured (desired_state null) |
        | agent unreachable or Docker unavailable | unknown |
        | container with the server's ID whose mcpanel.name label differs from the server's name (leftover of another server; never touched) | error |
        | container missing, operation '', last_error set (ensure failed for good, or a reconcile error before the agent call, e.g. no base domain) | error |
        | operation pulling/creating, or container missing | creating |
        | operation starting | starting |
        | operation stopping/removing | stopping |
        | container restarting | restarting |
        | container running | running |
        | container exited/created, desired_state running, exit_code != 0 or last_error set | error |
        | container exited/created | stopped |

        `restart_required`: the container exists, runs, and its label revision is older than the stored revision.
      required: [state, desired_state, restart_required, operation, last_error, started_at, memory_bytes, memory_limit_bytes, cpu_percent]
      properties:
        state: { $ref: '#/components/schemas/ServerState' }
        desired_state: { type: [string, 'null'], enum: [running, stopped, null] }
        restart_required: { type: boolean }
        operation: { type: string, enum: ['', pulling, creating, starting, stopping, removing] }
        last_error:
          type: string
          description: "The agent's last error, otherwise a reconcile error of the panel; '' when there is none. Only admins get the text: for other users it is always '' (state still says error)."
        started_at: { type: integer, format: int64, description: Unix ms; 0 = not running }
        memory_bytes: { type: integer, format: int64 }
        memory_limit_bytes: { type: integer, format: int64 }
        cpu_percent: { type: number }
    Server:
      type: object
      required: [id, name, permissions, address, instance, status]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        permissions: { type: array, items: { $ref: '#/components/schemas/Permission' }, description: Effective permissions of the caller (admins get all) }
        address: { type: [string, 'null'], description: '<name>.<base_domain>; null without base domain' }
        instance: { anyOf: [{ $ref: '#/components/schemas/InstanceConfig' }, { type: 'null' }] }
        status: { $ref: '#/components/schemas/ServerStatus' }
    CreateServerRequest:
      type: object
      additionalProperties: false
      required: [name, type, version, memory_mib, eula_accepted]
      properties:
        name: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,30}[a-z0-9]$' }
        type: { $ref: '#/components/schemas/InstanceType' }
        version: { type: string }
        loader_version: { type: [string, 'null'] }
        modpack: { type: [string, 'null'] }
        java: { $ref: '#/components/schemas/JavaVersion', description: Derived from type/version if omitted }
        memory_mib: { type: integer, minimum: 1024, maximum: 32768, multipleOf: 256 }
        properties: { $ref: '#/components/schemas/ServerProperties' }
        eula_accepted: { type: boolean, const: true }
    UpdateServerRequest:
      type: object
      additionalProperties: false
      description: Omitted fields stay unchanged; properties replaces the whole object.
      properties:
        version: { type: string }
        loader_version: { type: [string, 'null'] }
        modpack: { type: [string, 'null'] }
        java: { $ref: '#/components/schemas/JavaVersion' }
